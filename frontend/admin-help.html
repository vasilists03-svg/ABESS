<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="robots"
        content="noindex,nofollow,noarchive"
    >

    <title>Administrator Manual - Equation Solver</title>

    <link
        rel="stylesheet"
        href="./assets/css/admin.css?v=1"
    >

    <style>
        .manual-loader-page {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .manual-loader-card {
            padding: 24px;
            border-radius: 14px;
            background: #ffffff;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.10);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>

<main class="manual-loader-page">

    <section class="manual-loader-card">

        <h1>Administrator Manual</h1>

        <p id="manualLoading">
            Verifying administrator access and loading the manual...
        </p>

        <div
            id="manualAccessError"
            class="admin-message error hidden"
        >
            Administrator access is required.
        </div>

        <p>
            <a href="./index.html">
                Back to Equation Solver
            </a>
        </p>

    </section>

</main>

<script>
    (async function loadProtectedManual() {

        const token =
            localStorage.getItem("access_token");

        const accessMode =
            localStorage.getItem("access_mode");

        const loading =
            document.getElementById("manualLoading");

        const errorBox =
            document.getElementById("manualAccessError");


        function clearAuthState() {
            localStorage.removeItem("access_token");
            localStorage.removeItem("access_mode");
            localStorage.removeItem("user_email");
        }


        function redirectToSolver() {
            window.location.href =
                "./index.html";
        }


        if (
            !token ||
            accessMode !== "registered"
        ) {
            redirectToSolver();
            return;
        }


        try {

            const response =
                await fetch(
                    "/api/admin/manual-content",
                    {
                        method: "GET",
                        headers: {
                            "Authorization":
                                `Bearer ${token}`,
                            "Accept":
                                "text/html"
                        },
                        cache: "no-store"
                    }
                );


            if (response.status === 401) {
                clearAuthState();
                redirectToSolver();
                return;
            }


            if (response.status === 403) {

                if (loading) {
                    loading.classList.add(
                        "hidden"
                    );
                }

                if (errorBox) {
                    errorBox.classList.remove(
                        "hidden"
                    );
                }

                return;
            }


            if (!response.ok) {
                throw new Error(
                    "MANUAL_LOAD_FAILED"
                );
            }


            const html =
                await response.text();

            document.open();
            document.write(html);
            document.close();


        } catch (error) {

            console.error(
                "Administrator manual load failed.",
                error
            );

            if (loading) {
                loading.textContent =
                    "The administrator manual could not be loaded.";
            }
        }

    })();
</script>

</body>
</html>
